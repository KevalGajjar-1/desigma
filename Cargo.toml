[workspace]
resolver = "2"
members = ["crates/desigma-core", "crates/desigma-render", "apps/desigma"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deepfounder-ai/desigma"

[workspace.dependencies]
desigma-core = { path = "crates/desigma-core" }
desigma-render = { path = "crates/desigma-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vello = "0.11"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2
