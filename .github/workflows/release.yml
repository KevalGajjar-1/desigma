name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and packages everything, uploads workflow artifacts, and
  # creates no GitHub Release.
  workflow_dispatch:

env:
  RUST_VERSION: "1.93.1"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 runners are retired; cross-compile the Intel build on arm64.
          - os: macos-14
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build desigma and desigma-diff
        run: cargo build --release --locked --target ${{ matrix.target }} -p desigma-app -p desigma-diff

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: desigma-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Tags only: manual (workflow_dispatch) runs stop after uploading artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Shown above the generated notes.
          body: |
            ### Installing

            Download the archive for your platform below. These builds are **not code-signed yet**, so the first launch shows a warning:

            - **Windows:** in the SmartScreen dialog, click **More info → Run anyway**.
            - **macOS:** open it once, then click **Open Anyway** in **System Settings → Privacy & Security**, or run `xattr -d com.apple.quarantine ./desigma ./desigma-diff`.
            - **Linux:** no warning; unpack and run `./desigma`.

            Full instructions: [docs/install.md](https://github.com/deepfounder-ai/desigma/blob/main/docs/install.md). Check downloads against `SHA256SUMS`.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
