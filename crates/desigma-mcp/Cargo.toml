[package]
name = "desigma-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
desigma-doc.workspace = true
desigma-export.workspace = true
desigma-library.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process"] }
