[package]
name = "desigma-server"
description = "Headless always-on host for live collaboration: keeps a .desigma file shared permanently"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "desigma_server"
path = "src/lib.rs"

[[bin]]
name = "desigma-server"
path = "src/main.rs"

[dependencies]
desigma-doc.workspace = true
desigma-collab.workspace = true
desigma-net.workspace = true
desigma-library.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "signal"] }
